<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TF-FIU Maquettes papier</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

header {
    background: #101720;
    border-bottom: 1px solid #263343;
    padding: 20px;
}

.header {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: #4da3ff;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 20px;
}

nav a:hover {
    color: white;
}

.container {
    max-width: 1200px;
    width: 92%;
    margin: auto;
}

.hero {
    text-align: center;
    padding: 90px 10px 70px;
}

.hero h1 {
    font-size: clamp(60px, 10vw, 120px);
    margin: 0;
}

.hero p {
    color: #9ba8b7;
    max-width: 700px;
    margin: 25px auto;
    line-height: 1.7;
}

h2 {
    font-size: 30px;
}

.subtitle {
    color: #8996a5;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding-bottom: 80px;
}

.card {
    position: relative;
    background: #121b25;
    border: 1px solid #263343;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #4da3ff;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #070b10;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.new {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    background: #21c878;
    color: #06140d;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.card-content {
    padding: 18px;
}

.category {
    color: #4da3ff;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}

.card h3 {
    min-height: 50px;
    font-size: 17px;
    line-height: 1.4;
}

button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    background: #193552;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #275b87;
}

/* MODALE */

#modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    overflow-y: auto;
    background: rgba(0,0,0,.85);
    padding: 30px 15px;
}

.modal-box {
    max-width: 1100px;
    margin: auto;
    background: #0e151d;
    border: 1px solid #263343;
    border-radius: 20px;
    overflow: hidden;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px;
    border-bottom: 1px solid #263343;
}

.modal-header h2 {
    margin: 0;
}

.close {
    width: 45px;
    height: 45px;
    font-size: 25px;
}

.modal-body {
    padding: 25px;
}

.download-box {
    text-align: center;
    padding: 35px;
    border: 1px dashed #38536d;
    border-radius: 18px;
    margin-bottom: 30px;
}

.download-icon {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 20px;
    background: #193552;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
}

.download-box h3 {
    margin: 15px 0;
}

.download-button {
    display: inline-block;
    padding: 13px 20px;
    border-radius: 10px;
    background: #4da3ff;
    color: #061321;
    font-weight: bold;
    cursor: pointer;
}

.parts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.part {
    background: #121b25;
    border: 1px solid #263343;
    border-radius: 14px;
    overflow: hidden;
}

.part-image {
    aspect-ratio: 16 / 10;
    background: #070b10;
}

.part-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.part-content {
    padding: 13px;
}

.part-content strong {
    display: block;
    margin-bottom: 10px;
}

.part-content a {
    display: block;
    text-align: center;
    padding: 9px;
    border-radius: 8px;
    background: #172737;
    color: white;
    text-decoration: none;
}

.part-content a:hover {
    background: #275b87;
}

@media (max-width: 900px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .parts {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .header {
        display: block;
    }

    nav {
        margin-top: 15px;
    }

    nav a {
        margin-left: 0;
        margin-right: 15px;
    }

    .grid,
    .parts {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
<span>TF-FIU</span> Maquettes papier
</div>

<nav>
<a href="#">Accueil</a>
<a href="#nouveautes">Nouveautés</a>
</nav>

</div>

</header>


<main>

<div class="container">

<section class="hero">

<h1>Bienvenue</h1>

<p>
Bienvenue sur <strong>TF-FIU Maquettes papier</strong> !
<br>
Ici je publie mes maquettes papier de trains et de bus.
</p>

</section>


<section id="nouveautes">

<h2>Les 4 dernières nouveautés</h2>

<p class="subtitle">
Les dernières maquettes publiées.
</p>

<div class="grid" id="liste"></div>

</section>

</div>

</main>


<!-- FENÊTRE DE LA MAQUETTE -->

<div id="modal">

<div class="modal-box">

<div class="modal-header">

<div>
<h2 id="titre"></h2>
<div id="categorie" class="subtitle"></div>
</div>

<button class="close" onclick="fermer()">×</button>

</div>


<div class="modal-body">

<div class="download-box">

<div class="download-icon">
↓
</div>

<h3>Télécharger la maquette</h3>

<div class="download-button" onclick="telechargerTout()">
Télécharger les fichiers PNG
</div>

</div>


<div class="parts" id="parts"></div>

</div>

</div>

</div>


<script>

/*
=========================================================
MAQUETTES
=========================================================
*/

const maquettes = [

    {
        titre: "TGV POS Duplex OUIGO Tango",

        categorie: "TGV",

        nouveau: true,

        dossier: "maquettes/734/",

        miniature: "miniature 734.png",

        fichiers: [
            "1 734.png",
            "2 734.png",
            "3 734.png",
            "4 734.png",
            "5 734.png",
            "6 734.png",
            "7 734.png",
            "8 734.png",
            "9 734.png",
            "10 734.png",
            "bogie 734.png",
            "inter 734.png"
        ]
    }

];


/*
=========================================================
CONSTRUIT UNE URL CORRECTE POUR GITHUB
=========================================================
*/

function fichier(dossier, nom) {

    return dossier
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/")
        + "/"
        + encodeURIComponent(nom);

}


/*
=========================================================
AFFICHAGE DES NOUVEAUTÉS
=========================================================
*/

const liste = document.getElementById("liste");

maquettes.slice(0, 4).forEach((maquette, index) => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

        ${
            maquette.nouveau
            ? '<div class="new">Nouveau</div>'
            : ''
        }

        <div class="thumbnail">

            <img
                src="${fichier(
                    maquette.dossier,
                    maquette.miniature
                )}"
                alt="${maquette.titre}"
            >

        </div>

        <div class="card-content">

            <div class="category">
                ${maquette.categorie}
            </div>

            <h3>
                ${maquette.titre}
            </h3>

            <button onclick="ouvrir(${index})">
                Voir la maquette
            </button>

        </div>
    `;

    liste.appendChild(card);

});


/*
=========================================================
OUVRIR LA MAQUETTE
=========================================================
*/

let actuelle = null;

function ouvrir(index) {

    actuelle = maquettes[index];

    document.getElementById("titre").textContent =
        actuelle.titre;

    document.getElementById("categorie").textContent =
        actuelle.categorie;

    const parts = document.getElementById("parts");

    parts.innerHTML = "";


    actuelle.fichiers.forEach((nom, index) => {

        const url = fichier(
            actuelle.dossier,
            nom
        );

        const element = document.createElement("div");

        element.className = "part";

        element.innerHTML = `

            <div class="part-image">

                <img
                    src="${url}"
                    alt="${nom}"
                >

            </div>

            <div class="part-content">

                <strong>
                    ${index + 1}. ${nom}
                </strong>

                <a
                    href="${url}"
                    download="${nom}">

                    Télécharger le PNG

                </a>

            </div>
        `;

        parts.appendChild(element);

    });


    document.getElementById("modal").style.display =
        "block";

    document.body.style.overflow =
        "hidden";
}


/*
=========================================================
FERMER
=========================================================
*/

function fermer() {

    document.getElementById("modal").style.display =
        "none";

    document.body.style.overflow =
        "auto";
}


/*
=========================================================
TÉLÉCHARGER TOUS LES PNG
=========================================================
*/

function telechargerTout() {

    if (!actuelle) return;

    actuelle.fichiers.forEach((nom, index) => {

        setTimeout(() => {

            const lien =
                document.createElement("a");

            lien.href =
                fichier(actuelle.dossier, nom);

            lien.download = nom;

            document.body.appendChild(lien);

            lien.click();

            document.body.removeChild(lien);

        }, index * 500);

    });

}


/*
=========================================================
FERMER EN CLIQUANT À CÔTÉ
=========================================================
*/

document.getElementById("modal").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {
            fermer();
        }

    }
);

</script>

</body>
</html>
